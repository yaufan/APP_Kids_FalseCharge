name: sharp_eyes
description: "眼尖尖大挑戰：2～5 歲的找碴遊戲。"
publish_to: 'none'

# The version (also in lib/app/version.dart and CHANGELOG.md; test/version_test.dart checks they agree).
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  flutter_tts: ^4.2.5
  go_router: ^18.1.1
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/scenes/
    - assets/sounds/
    - assets/art/a/
    - assets/art/a/park/
    - assets/art/a/market/
    - assets/art/a/beach/
    - assets/art/a/zoo/
    - assets/art/a/party/
    - assets/art/a/kitchen/
    - assets/art/b/
    - assets/art/b/park/
    - assets/art/b/market/
    - assets/art/b/beach/
    - assets/art/b/zoo/
    - assets/art/b/party/
    - assets/art/b/kitchen/
    - assets/art/c/
    - assets/art/c/park/
    - assets/art/c/market/
    - assets/art/c/beach/
    - assets/art/c/zoo/
    - assets/art/c/party/
    - assets/art/c/kitchen/
  fonts:
    - family: Huninn
      fonts:
        - asset: assets/fonts/jf-openhuninn-2.1.ttf
